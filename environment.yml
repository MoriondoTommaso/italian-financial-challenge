name: ifc
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11

  # Core scientific stack (binari conda)
  - numpy=2.3.5
  - pandas=2.3.3
  - scipy=1.16.3
  - scikit-learn=1.8.0
  - numba=0.62.1
  - llvmlite=0.45.1
  - lightgbm=4.6.0
  - xgboost=3.1.3
  - shap=0.50.0
  - pyarrow

  # Stats / viz
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - plotly=6.5.2
  - statsmodels=0.14.6

  # Notebook / dev
  - ipython=9.9.0
  - ipykernel=7.1.0
  - jupyter_client=8.8.0
  - jupyter_core=5.9.1
  - pytest=9.0.2

  # Utils
  - pyyaml=6.0.3
  - requests=2.32.5
  - python-dotenv=1.2.1
  - tqdm=4.67.1
  - joblib=1.5.3

  # pip-only / niche
  - pip
  - pip:
      - category_encoders==2.9.0
      - phik==0.12.5
      - visions==0.8.1
      - ydata-profiling==4.18.1
      - wordcloud==1.9.5
      - minify_html==0.18.1
      - ImageHash==4.3.2
      - filetype==1.2.0
      - puremagic==1.30
      - dacite==1.9.2
      - typeguard==4.4.4
      - typing-inspection==0.4.2
      - annotated-types==0.7.0
      - multimethod==1.12
      - slicer==0.0.8
      - narwhals==2.15.0
      - pure_eval==0.2.3
      - stack-data==0.6.3
      - wcwidth==0.2.14
      - tzdata==2025.3
      - python-dateutil==2.9.0.post0
      - pytz==2025.2
      - six==1.17.0
      - charset-normalizer==3.4.4
      - idna==3.11
      - urllib3==2.6.3
      - certifi==2026.1.4

      # tuo progetto
      - -e git+https://github.com/MoriondoTommaso/italian-financial-challenge.git@d02156f39bddee4e85d3bde3ca707abbc7bf0d7a#egg=italian_financial_challenge
